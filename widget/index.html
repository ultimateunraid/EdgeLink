<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tr('EdgeLink WoW')</title>
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<meta name="x-icue-widget-preview" content="resources/preview.png" />
<meta name="x-icue-widget-group" content="EdgeLink" />
<link rel="stylesheet" href="styles/edgelink.css" />
</head>
<body>
<div id="app">
  <nav id="nav">
    <button data-view="bags" class="active"><span class="ico">&#127890;</span>Bags</button>
    <button data-view="gear"><span class="ico">&#128737;</span><span class="two">Character<br />Info</span></button>
    <button data-view="quests"><span class="ico">&#10071;</span>Quests</button>
    <button data-view="map"><span class="ico">&#129517;</span>Map</button>
    <button data-view="prof"><span class="ico">&#9874;</span>Professions</button>
    <button data-view="sess"><span class="ico">&#128202;</span>Session</button>
  </nav>
  <div id="top">
    <div id="who">EdgeLink</div>
    <div id="money"></div>
    <div id="where"></div>
    <div id="alert"></div>
    <div id="wowbtns"><button data-win="2">Map</button><button data-win="1">Bags</button><button data-win="3">Character</button><button data-win="5">Quest log</button><button data-win="4">Sort bags</button></div>
    <div id="status" class="warn">Connecting...</div>
  </div>
  <main id="main">
    <section class="view active" id="v-bags">
      <div id="bagbar"><div id="bagsum"></div><span class="sp"></span><button id="bagmode"></button></div>
      <div id="bags"></div>
      <div id="chars"></div>
    </section>
    <section class="view" id="v-gear">
      <div id="gearwrap">
        <div id="cf">
          <div id="cfTitle"><span class="nm"></span><span class="lv"></span></div>
          <div id="cfBody">
            <div class="slots" id="gl"></div>
            <div id="model">
              <div class="stage">
                <svg class="fig" viewBox="0 0 100 200" aria-hidden="true"><circle cx="50" cy="22" r="15"/><path d="M28 44 Q50 36 72 44 L84 100 L74 102 L68 66 L66 120 L72 196 L58 196 L52 128 L48 128 L42 196 L28 196 L34 120 L32 66 L26 102 L16 100 Z"/></svg>
              </div>
              <div id="weapons"></div>
            </div>
            <div class="slots" id="gr"></div>
          </div>
        </div>
        <div id="stats"></div>
        <div id="reps"></div>
      </div>
    </section>
    <section class="view" id="v-quests"><div id="qbar"><div class="sum"></div><button id="qexp">Expand all</button><button id="qcol">Collapse all</button></div><div id="quests"></div></section>
    <section class="view" id="v-map">
      <div id="maps">
        <div class="mapframe" id="mf-zone"><button id="coordbtn">&#8982; Coordinates</button><span class="ml"></span><div class="hl"></div><canvas class="areas"></canvas><canvas class="gps"></canvas><div class="pins"></div><div class="marker"></div></div>
        <div class="mapframe" id="mf-cont"><div id="browse"><span class="bl"></span><div class="bhint"></div></div><div id="bnav"><button data-b="back">&#9664; Back</button><button data-b="world">World</button><button data-b="home">My location</button></div><span class="ml"></span><div class="hl"></div><canvas class="gps"></canvas><div class="pins small"></div><div class="marker small"></div></div>
        <div id="mapside">
          <div id="mapinfo"></div>
          <div id="route">
            <div class="rh"><span class="rl"></span><button class="rx" data-act="clear">&#10005;</button></div>
            <div class="rd"><span class="dist"></span><span class="turn"></span></div>
            <div class="steps"></div>
            <div class="rb"><button data-act="wp">Set waypoint in WoW</button><button data-act="track">Track in WoW</button><button data-act="mode"></button></div>
          </div>
          <div id="pinbar">
            <button data-kind="F"><span class="pi F">&#9992;</span>Flight points</button>
            <button data-kind="D"><span class="pi D">&#9873;</span>Dungeons</button>
            <button data-kind="A"><span class="pi A">&#9733;</span>Points of interest</button>
            <button data-kind="Q"><span class="pi Q">!</span>Quest objectives</button>
            <button data-kind="gH"><span class="pi gH">&#10047;</span><span class="lb">Herbs</span></button>
            <button data-kind="gM"><span class="pi gM">&#9670;</span><span class="lb">Ore</span></button>
            <button data-kind="gF"><span class="pi gF">&#8776;</span><span class="lb">Fishing</span></button>
            <button data-kind="gT"><span class="pi gT">&#9635;</span><span class="lb">Treasure</span></button>
          </div>
          <div id="zq"><div class="zqh"></div><div class="zql"></div></div>
        </div>
      </div>
    </section>
    <section class="view" id="v-prof"><div id="prof"><div id="skills"></div>
      <div id="recipes"><div id="rbar"></div><div id="rlist"></div></div>
      <div id="mats"></div></div></section>
    <section class="view" id="v-sess"><div id="sess"><div id="scards"></div></div></section>
    <div id="keypad"><div class="kh">Go to coordinates in <span class="kz"></span></div><div class="kd"><span class="kx on">--.-</span><span>,</span><span class="ky">--.-</span></div>
      <div class="kk"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>.</button><button>0</button><button data-k="del">&#9003;</button></div>
      <div class="ka"><button data-k="cancel">Cancel</button><button data-k="next">Next</button><button data-k="go">Route &#10148;</button></div></div>
    <div id="tip"><div class="nm"></div><div class="meta"></div><div class="acts"></div></div>
    <div id="toast"></div>
  </main>
</div>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var BRIDGE = params.get("bridge") ||
    (location.protocol.indexOf("http") === 0 && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) ? "" : "http://localhost:8787");
  var POLL_MS = 250, lastPosKey = "", inputAllowed = false;

  var SLOT_NAMES = { 1: "Head", 2: "Neck", 3: "Shoulders", 4: "Shirt", 5: "Chest", 6: "Waist", 7: "Legs", 8: "Feet", 9: "Wrists",
    10: "Hands", 11: "Finger", 12: "Finger", 13: "Trinket", 14: "Trinket", 15: "Back", 16: "Main Hand", 17: "Off Hand", 18: "Ranged", 19: "Tabard" };
  var LEFT = [1, 2, 3, 15, 5, 4, 19, 9], RIGHT = [10, 6, 7, 8, 11, 12, 13, 14], WEAPONS = [16, 17, 18];
  var CLASS_COLORS = { WARRIOR: "#c69b6d", PALADIN: "#f48cba", HUNTER: "#aad372", ROGUE: "#fff468", PRIEST: "#ffffff", SHAMAN: "#0070dd",
    MAGE: "#3fc7eb", WARLOCK: "#8788ee", DRUID: "#ff7c0a", DEATHKNIGHT: "#c41e3a", MONK: "#00ff98", DEMONHUNTER: "#a330c9", EVOKER: "#33937f" };

  var state = null, lastKey = "", selected = null, tipTimer = null;
  var $ = function (id) { return document.getElementById(id); };
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function qcol(q) { return (q >= 0 && q <= 7) ? "var(--q" + q + ")" : "#2b3747"; }
  function cap(s) { s = String(s || "").toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
  function initials(name) {
    var w = String(name || "?").replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean);
    return ((w[0] || "?")[0] + (w.length > 1 ? w[w.length - 1][0] : (w[0] || "")[1] || "")).toUpperCase();
  }
  function money(c) {
    if (c == null) return "";
    var g = Math.floor(c / 10000), s = Math.floor(c / 100) % 100, cu = c % 100;
    // Coins instead of letters, like the game: gold, silver, copper
    var coin = function (n, k) { return '<span class="mny">' + n + '<i class="coin ' + k + '"></i></span>'; };
    return '<span class="mnys">' + (g ? coin(g.toLocaleString(), "g") : "") + (g || s ? coin(s, "s") : "") + coin(cu, "c") + "</span>";
  }
  function durColor(p) { return p > 50 ? "var(--ok)" : p > 20 ? "var(--warn)" : "var(--bad)"; }
  // Tile with icon (falls back to initials if the companion has no icon for the item)
  function tile(it, extraClass, attrs) {
    return '<div class="tile ' + (extraClass || "") + '" ' + (attrs || "") + ' style="border-color:' + qcol(it.q) + ";color:" + qcol(it.q) + '">' +
      '<span class="ini">' + esc(initials(it.name)) + "</span>" +
      (it.id ? '<img src="' + BRIDGE + "/icon/" + it.id + '" alt="" onerror="this.remove()" />' : "") +
      (it.count > 1 ? '<span class="ct">' + it.count + "</span>" : "") + "</div>";
  }
  function durHtml(g) {
    if (!g || !g.durMax) return "";
    var p = Math.max(0, Math.min(100, Math.round(100 * g.dur / g.durMax)));
    return '<div class="dur"><div class="bar"><i style="width:' + p + "%;background:" + durColor(p) + '"></i></div><span class="t">' + g.dur + " / " + g.durMax + "</span></div>";
  }

  // Navigation
  function showView(name) {
    document.querySelectorAll("#nav button").forEach(function (x) { x.classList.toggle("active", x.dataset.view === name); });
    document.querySelectorAll(".view").forEach(function (v) { v.classList.toggle("active", v.id === "v-" + name); });
    hideTip(); layout(); if (name === "map") drawRoute();
    if (name === "sess") renderSession();
    if (name === "bags" && bagMode === "all") loadChars();
    if (name !== "map") $("keypad").style.display = "none";
  }
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"), function (b) {
    b.addEventListener("click", function () { showView(b.dataset.view); });
  });

  function renderHeader() {
    var p = state && state.player;
    $("who").innerHTML = p ? esc(p.name) + "<small>Lv " + esc(p.level) + " " + esc(p.race) + " " + esc(cap(p.class)) + "</small>" : "EdgeLink";
    $("money").innerHTML = p ? money(p.money) : "";
    var free = 0, total = 0;
    (state && state.bags || []).forEach(function (b) { free += b.free; total += b.slots; });
    $("where").textContent = p ? (p.zone + (p.subzone ? " • " + p.subzone : "") + (total ? "   |   " + free + "/" + total + " free" : "")) : "";
    document.documentElement.style.setProperty("--cls", (p && CLASS_COLORS[p.class]) || "#c69b6d");
    $("wowbtns").style.display = canControl() ? "flex" : "none";
    renderAlert();
  }
  function hasCap(k) { return !!(state && state.pinCaps && state.pinCaps.indexOf(k) >= 0); }
  function canControl() { return inputAllowed && hasCap("I"); }
  $("wowbtns").addEventListener("click", function (e) {
    var b = e.target.closest("[data-win]"); if (!b) return;
    sendGame("5" + b.dataset.win, b.textContent + " toggled in WoW");
  });
  // Things the minimap is pointing out right now (rares, treasures): a banner you can tap to route there
  function nearbyKind(v) {
    var a = String(v.atlas || "").toLowerCase();
    if (a.indexOf("loot") >= 0 || a.indexOf("treasure") >= 0 || a.indexOf("chest") >= 0) return "Treasure";
    if (a.indexOf("kill") >= 0 || a.indexOf("rare") >= 0 || a.indexOf("elite") >= 0 || a.indexOf("boss") >= 0) return "Rare";
    return "Nearby";
  }
  var seenNearby = {};
  function renderAlert() {
    var list = state && state.nearby || [], el = $("alert");
    if (!list.length) { el.style.display = "none"; el.innerHTML = ""; return; }
    var v = list[0];
    el.style.display = "flex";
    el.innerHTML = '<b>' + nearbyKind(v) + '</b><span>' + esc(v.name) + (list.length > 1 ? " +" + (list.length - 1) : "") + '</span>' + (v.x != null ? '<button>Route &#10148;</button>' : "");
    var key = v.name + "@" + v.map;
    if (!seenNearby[key]) { seenNearby[key] = 1; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  }
  $("alert").addEventListener("click", function () {
    var v = state && state.nearby && state.nearby[0]; if (!v || v.x == null) return;
    setRoute({ map: v.map, x: v.x, y: v.y, label: v.name }); showView("map");
  });

  /* ---------- Bags ---------- */
  var bagCols = 4;
  function renderBags() {
    var bags = state && state.bags || [];
    if (!bags.length) { $("bags").innerHTML = '<div class="empty">No bag data yet.</div>'; return; }
    var html = "";
    bags.forEach(function (b) {
      var bySlot = {};
      b.items.forEach(function (it) { bySlot[it.slot] = it; });
      var cols = Math.min(b.slots, bagCols);
      html += '<div class="bag"><h3><span>' + esc(b.name) + "</span><span>" + b.free + "/" + b.slots + '</span></h3><div class="grid" style="grid-template-columns:repeat(' + cols + ',var(--tile))">';
      for (var s = 1; s <= b.slots; s++) {
        var it = bySlot[s];
        if (!it) { html += '<div class="tile free"></div>'; continue; }
        var key = b.bag + ":" + s;
        html += tile(it, selected === key ? "sel" : "", 'data-key="' + key + '"');
      }
      html += "</div></div>";
    });
    $("bags").innerHTML = html;
    renderBagBar();
  }
  var bagMode = "mine", chars = null;
  function renderBagBar() {
    var free = 0, total = 0, junk = 0, junkN = 0, vend = 0, ah = 0, anyAh = false;
    (state && state.bags || []).forEach(function (b) {
      free += b.free; total += b.slots;
      b.items.forEach(function (it) {
        if (it.sell) { vend += it.sell * it.count; if (it.q === 0) { junk += it.sell * it.count; junkN += it.count; } }
        if (it.ah) { ah += it.ah * it.count; anyAh = true; }
      });
    });
    $("bagsum").innerHTML = bagMode === "all" ? "<span><b>All characters</b> bags and bank, as last seen</span>" :
      "<span><b>" + free + "</b> of " + total + " slots free</span>" +
      "<span>Junk <b>" + (junkN ? money(junk) : "none") + "</b>" + (junkN ? " (" + junkN + ")" : "") + "</span>" +
      "<span>Sells to vendors for <b>" + money(vend) + "</b></span>" +
      (anyAh ? "<span>Auction value <b>" + money(ah) + "</b></span>" : hasCap("U") ? "<span>No auction prices yet (scan in Auctionator)</span>" : "");
    $("bagmode").textContent = bagMode === "all" ? "This character" : "All characters";
    $("bags").style.display = bagMode === "all" ? "none" : "";
    $("chars").style.display = bagMode === "all" ? "" : "none";
  }
  $("bagmode").addEventListener("click", function () {
    bagMode = bagMode === "all" ? "mine" : "all"; hideTip(); renderBagBar();
    if (bagMode === "all") loadChars(); else layout();
  });
  function loadChars() {
    fetch(BRIDGE + "/chars", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) { chars = j; renderChars(); })
      .catch(function () { $("chars").innerHTML = '<div class="empty">Could not load characters.</div>'; });
  }
  function renderChars() {
    var list = (chars || []).slice().sort(function (a, b) { return b.seen - a.seen; });
    if (!list.length) { $("chars").innerHTML = '<div class="empty">No characters saved yet. Log in on each one with EdgeLink running.</div>'; return; }
    $("chars").innerHTML = list.map(function (c, ci) {
      var p = c.char.player || {}, items = {}, n = 0;
      var add = function (it, where) {
        var cur = items[it.id]; if (!cur) { items[it.id] = cur = { id: it.id, name: it.name, q: it.q, count: 0, bank: 0 }; }
        cur.count += it.count; if (where) cur.bank += it.count;
      };
      (c.char.bags || []).forEach(function (b) { b.items.forEach(function (it) { add(it); }); });
      (c.char.bank || []).forEach(function (it) { add(it, 1); });
      var arr = Object.keys(items).map(function (k) { return items[k]; }).sort(function (a, b) { return (b.q - a.q) || (a.name < b.name ? -1 : 1); });
      var age = Math.max(0, Date.now() / 1000 - c.seen), when = age < 120 ? "now" : age < 7200 ? Math.round(age / 60) + " min ago" : age < 172800 ? Math.round(age / 3600) + " h ago" : Math.round(age / 86400) + " days ago";
      return '<div class="chr"><h3><span>' + esc(p.name || c.char.key) + ' <small>Lv ' + esc(p.level) + " " + esc(cap(p.class)) + '</small></span><span>' + money(p.money) + ' <small>' + when +
        ((c.char.bank || []).length ? "" : " \u2022 bank not seen yet") + '</small></span></h3><div class="grid">' +
        arr.map(function (it) { return tile(it, "", 'data-chr="' + ci + '" data-name="' + esc(it.name) + '" data-count="' + it.count + '" data-bank="' + it.bank + '"'); }).join("") + "</div></div>";
    }).join("");
  }
  $("chars").addEventListener("click", function (e) {
    var el = e.target.closest(".tile[data-chr]"); if (!el) return hideTip();
    var bank = +el.dataset.bank, cnt = +el.dataset.count;
    tipAt(el, esc(el.dataset.name), cnt + " total" + (bank ? "   \u2022   " + bank + " in the bank" : ""));
  });

  // Pick the largest tile size (and columns per bag) where every bag fits on screen.
  function fitBags() {
    var view = $("v-bags"), bags = state && state.bags || [];
    if (!bags.length || !view.classList.contains("active")) return;
    var W = view.clientWidth - 36, H = view.clientHeight - 28 - $("bagbar").offsetHeight - 8;
    var GAP = 12, G = 6, PAD = 18, HEAD = 26, best = null;
    [4, 5, 6, 7, 8, 10, 12].forEach(function (c) {
      for (var t = 120; t >= 28; t -= 2) {
        var rowW = 0, rowH = 0, total = 0, ok = true;
        for (var i = 0; i < bags.length; i++) {
          var cols = Math.min(bags[i].slots, c), rows = Math.ceil(bags[i].slots / cols);
          var w = cols * t + (cols - 1) * G + PAD, h = HEAD + rows * t + (rows - 1) * G + PAD;
          if (w > W) { ok = false; break; }
          if (rowW > 0 && rowW + GAP + w > W) { total += rowH + GAP; rowW = 0; rowH = 0; }
          rowW += (rowW > 0 ? GAP : 0) + w; rowH = Math.max(rowH, h);
        }
        total += rowH;
        if (ok && total <= H) { if (!best || t > best.t) best = { t: t, c: c }; break; }
      }
    });
    if (!best) best = { t: 28, c: 12 };
    document.documentElement.style.setProperty("--tile", best.t + "px");
    if (best.c !== bagCols) { bagCols = best.c; renderBags(); }
  }

  $("bags").addEventListener("click", function (e) {
    var el = e.target.closest(".tile[data-key]");
    if (!el) { selected = null; hideTip(); renderBags(); return; }
    selected = (selected === el.dataset.key) ? null : el.dataset.key;
    renderBags();
    if (selected) showTip(findItem(selected), $("bags").querySelector('.tile[data-key="' + selected + '"]')); else hideTip();
  });
  function findItem(key) {
    if (!key || !state) return null;
    var parts = key.split(":").map(Number);
    var bag = (state.bags || []).filter(function (b) { return b.bag === parts[0]; })[0];
    return bag && bag.items.filter(function (i) { return i.slot === parts[1]; })[0];
  }
  function showTip(it, el) {
    if (!it || !el) return hideTip();
    var tip = $("tip"), main = $("main").getBoundingClientRect(), r = el.getBoundingClientRect();
    tip.querySelector(".nm").innerHTML = '<span style="color:' + qcol(it.q) + '">' + esc(it.name) + "</span>";
    tip.querySelector(".meta").innerHTML = (it.count > 1 ? "Stack of " + it.count + "   \u2022   " : "") +
      (it.sell ? "Vendor " + money(it.sell * it.count) : "No vendor value") + (it.ah ? "   \u2022   Auction " + money(it.ah * it.count) : "");
    tipTarget = null; tip.classList.remove("act"); tip.querySelector(".acts").innerHTML = "";
    tip.style.display = "block";
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = Math.min(Math.max(8, r.left - main.left + r.width / 2 - tw / 2), main.width - tw - 8);
    var y = r.top - main.top - th - 10;
    if (y < 8) y = r.bottom - main.top + 10;
    tip.style.left = x + "px"; tip.style.top = y + "px";
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { selected = null; hideTip(); renderBags(); }, 6000);
  }
  function hideTip() { var t = $("tip"); t.style.display = "none"; t.classList.remove("act"); t.querySelector(".acts").innerHTML = ""; clearTimeout(tipTimer); }

  /* ---------- Gear: in-game character window layout ---------- */
  function gearSlot(s, g) {
    if (!g) return '<div class="gs"><div class="tile free"><span class="lbl">' + SLOT_NAMES[s] + "</span></div></div>";
    var bar = "", broken = false;
    if (g.durMax) {
      var p = Math.max(0, Math.min(100, Math.round(100 * g.dur / g.durMax)));
      broken = p <= 20;
      bar = '<div class="db"><i style="width:' + p + "%;background:" + durColor(p) + '"></i></div>';
    }
    return '<div class="gs">' + tile(g, broken ? "broken" : "", 'data-slot="' + s + '"').replace("</div>", bar + "</div>") + "</div>";
  }
  function renderGear() {
    var gear = state && state.gear || [], by = {}, p = state && state.player;
    gear.forEach(function (g) { by[g.slot] = g; });
    $("gl").innerHTML = LEFT.map(function (s) { return gearSlot(s, by[s]); }).join("");
    $("gr").innerHTML = RIGHT.map(function (s) { return gearSlot(s, by[s]); }).join("");
    $("weapons").innerHTML = WEAPONS.map(function (s) { return gearSlot(s, by[s]); }).join("");
    document.querySelector("#cfTitle .nm").textContent = p ? p.name : "";
    document.querySelector("#cfTitle .lv").textContent = p ? "Level " + p.level + " " + p.race + " " + cap(p.class) : "";
    renderStats(gear);
  }
  function renderStats(gear) {
    var groups = [], byName = {};
    (state && state.stats || []).forEach(function (t) {
      if (!byName[t.group]) { byName[t.group] = []; groups.push(t.group); }
      byName[t.group].push(t);
    });
    var cur = 0, max = 0, low = [];
    gear.forEach(function (g) {
      if (!g.durMax) return;
      cur += g.dur; max += g.durMax;
      var pc = Math.round(100 * g.dur / g.durMax);
      if (pc <= 50) low.push(esc(g.name) + " " + pc + "%");
    });
    var pct = max ? Math.round(100 * cur / max) : 100;
    var html = '<div class="sg"><h4>Durability</h4><div class="r"><span class="k">Overall</span><span class="v">' + pct + "%</span></div>" +
      '<div class="bar"><i style="width:' + pct + "%;background:" + durColor(pct) + '"></i></div>' +

          if (selected) { var it = findItem(selected); if (!it) { selected = null; hideTip(); } }
        }
      }
    }).catch(function () {
      setStatus("bad", "Companion offline");
    }).then(function () { setTimeout(poll, POLL_MS); });
  }
  renderBags(); renderGear(); renderQuests(); renderMap();
  poll();
})();
</script>
