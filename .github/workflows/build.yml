name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign the build with Azure Artifact Signing (test the signing setup without releasing)'
        type: boolean
        default: false

# Nothing gets write access or an Azure token by default; each job asks only for what it needs.
permissions:
  contents: read

# Code signing (Azure Artifact Signing) runs on v* tags, or on a manual run with "sign" ticked, once these are set
# in the repository settings (Settings > Secrets and variables > Actions):
#   variables: AZURE_SIGNING_ENDPOINT (e.g. https://eus.codesigning.azure.net/), AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# A v* tag without signing set up FAILS, unless the variable ALLOW_UNSIGNED_RELEASE is 'true'.
# (Signed copies of EdgeLink never install an unsigned update, and unsigned copies never self-update.)
#
# Job layout (why it is split): the jobs that hold the Azure token (id-token: write) run ONLY pinned Microsoft
# actions on files built elsewhere. Tests, pip, Node, choco and the build scripts never see the token, so a
# compromised dependency cannot sign anything with the EdgeLink certificate.
#   build -> sign-exe -> package -> sign-setup -> release
# All actions are pinned to a commit SHA (the comment shows the tag it came from).
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Addon tests
        run: |
          pip install lupa==2.8 pillow==13.0.0
          python tests/roundtrip.py
          python tests/input_test.py

      - name: Update flow test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/update_test.ps1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build companion and widget package
        shell: cmd
        run: companion\build.cmd

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EdgeLink-unsigned
          path: dist/EdgeLink/
          if-no-files-found: error

  # Signs EdgeLink.exe before the installer is built, so the setup program carries the signed copy.
  sign-exe:
    needs: build
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.sign == true) && vars.AZURE_SIGNING_ACCOUNT != ''
    runs-on: windows-2025
    # Azure trusts the token subject repo:ultimateunraid@66378847/EdgeLink@1457993618:environment:release.
    # Protect the environment: deployment rule "tags v*" (plus your manual runs), required reviewer = you.
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: EdgeLink-unsigned
          path: dist/EdgeLink

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign EdgeLink.exe
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}\dist\EdgeLink\EdgeLink.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EdgeLink-signed
          path: dist/EdgeLink/
          if-no-files-found: error

  package:
    needs: [build, sign-exe]
    # runs after sign-exe when signing, or straight after build when not
    if: always() && needs.build.result == 'success' && (needs.sign-exe.result == 'success' || needs.sign-exe.result == 'skipped')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-exe.result == 'success' && 'EdgeLink-signed' || 'EdgeLink-unsigned' }}
          path: dist/EdgeLink

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EdgeLink
          path: dist/EdgeLink/
          if-no-files-found: error

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\EdgeLink.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EdgeLink-Setup-unsigned
          path: dist/release/EdgeLink-Setup-*.exe
          if-no-files-found: error

  sign-setup:
    needs: package
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.sign == true) && vars.AZURE_SIGNING_ACCOUNT != ''
    runs-on: windows-2025
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: EdgeLink-Setup-unsigned
          path: dist/release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: EdgeLink
          path: dist/EdgeLink

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the setup program
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true

      # Both files must carry a valid, timestamped signature from the same publisher before anything is released.
      # (EdgeLink's updater refuses an update that is unsigned or signed by a different publisher.)
      - name: Check signatures
        shell: pwsh
        run: |
          $files = @('dist/EdgeLink/EdgeLink.exe') + (Get-ChildItem dist/release/EdgeLink-Setup-*.exe).FullName
          $subjects = @()
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) : $($s.SignerCertificate.Subject) : timestamp $([bool]$s.TimeStamperCertificate)"
            if ($s.Status -ne 'Valid') { Write-Error "$f is not validly signed ($($s.StatusMessage))"; exit 1 }
            if (-not $s.TimeStamperCertificate) { Write-Error "$f has no timestamp"; exit 1 }
            $subjects += $s.SignerCertificate.Subject
          }
          if (($subjects | Select-Object -Unique).Count -ne 1) { Write-Error "signers differ: $($subjects -join ' | ')"; exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EdgeLink-Setup
          path: dist/release/EdgeLink-Setup-*.exe
          if-no-files-found: error

  # On a version tag: publish a GitHub Release with the setup program. Its notes are this version's
  # section of CHANGELOG.md; EdgeLink shows them on the Edge before offering the upgrade, and installs
  # the setup program from this release (checking GitHub's SHA-256 and the code signature).
  release:
    needs: [package, sign-setup]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' && (needs.sign-setup.result == 'success' || needs.sign-setup.result == 'skipped')
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Refuse unsigned releases
        if: needs.sign-setup.result != 'success' && vars.ALLOW_UNSIGNED_RELEASE != 'true'
        run: |
          echo "::error::Signing is not set up (AZURE_SIGNING_ACCOUNT), so this tag was not released. Set ALLOW_UNSIGNED_RELEASE=true to publish unsigned on purpose."
          exit 1

      - name: Unsigned release warning
        if: needs.sign-setup.result != 'success'
        run: echo "::warning::This release is NOT code-signed. Installed copies will only be told about it, not update themselves."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-setup.result == 'success' && 'EdgeLink-Setup' || 'EdgeLink-Setup-unsigned' }}
          path: dist/release

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $ver = $tag.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^##\s+\[?v?$([regex]::Escape($ver))\]?(\s|$)" | Select-Object -First 1).LineNumber
          if (-not $start) { Write-Error "CHANGELOG.md has no '## $ver' section"; exit 1 }
          $notes = @()
          for ($i = $start; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^##\s') { break }; $notes += $lines[$i] }
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8 release-notes.md
          $setup = Get-ChildItem dist/release/EdgeLink-Setup-*.exe | Select-Object -First 1
          gh release create $tag $setup.FullName --repo $env:GITHUB_REPOSITORY --title "EdgeLink $ver" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
